info:
  name: Reset Env Variables
  type: http
  seq: 3

http:
  method: GET
  url: https://airportgap.com/api/airports
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const variables = [
            "airportid",
            "selectedairportid",
            "selectedAirport",
            "airportNote",
            "favoriteId"
        ];

        variables.forEach(variable => {
            bru.deleteEnvVar(variable);
        });

        console.log("All airport-related environment variables deleted");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
