info:
  name: 01_GET_AllAirports
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseurl}}/airports"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        // Get the API response
        const response = res.getBody();

        // Extract all airport IDs using map()
        const airportIds = response.data.map(airport => airport.id);

        // Save all airport IDs into the environment variable
        bru.setEnvVar("airportid", airportIds);

        console.log("Airport IDs:", airportIds);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
