info:
  name: 01_GET_AirportByID_BeforeSavingEnvVar
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseurl}}/airports/{{selectedAirport}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Retrieve airport IDs from environment variables
        const airportIds = bru.getEnvVar("airportid");

        // Select the airport at index 0
        const selectedAirport = airportIds[0];

        // Store the selected airport ID
        bru.setEnvVar("selectedAirport", selectedAirport);

        // Display the selected airport ID
        console.log("Selected Airport ID:", selectedAirport);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
